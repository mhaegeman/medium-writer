[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medium-writer"
version = "0.2.0"
description = "An LLM harness for researching and writing blog articles in your own voice, driven from a Claude Code session"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
medium-writer = "medium_writer.main:app"
mw = "medium_writer.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medium_writer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
